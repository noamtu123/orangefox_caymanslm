name: Build OrangeFox (fox_14.1)

# Manual only. Never auto-triggered. Do not enable push/schedule triggers.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "FOX_BUILD_TYPE"
        default: "Alpha"
        required: true

permissions:
  contents: read

concurrency:
  group: orangefox-caymanslm
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    # GitHub-hosted runners hard-cap a job at 360 minutes; a larger value is
    # silently clamped, so set the real ceiling here.
    timeout-minutes: 360

    steps:
      - name: Free up disk space (aggressive, on root)
        run: |
          # maximize-build-space's LVM only yielded ~42 GiB here (too small for a
          # 14.1 sync). Aggressive cleanup of preinstalled toolchains instead
          # leaves the full ~68 GiB free on root, which we build on directly.
          echo "Before cleanup:"; df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /opt/hostedtoolcache \
            /usr/share/dotnet \
            /opt/ghc /usr/local/.ghcup \
            /usr/share/swift \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/lib/node_modules \
            /opt/az /opt/microsoft /usr/local/julia* \
            /usr/lib/google-cloud-sdk /usr/local/share/chromium || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo "After cleanup:"; df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf imagemagick \
            lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop \
            pngcrush python-is-python3 python3 rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev
          sudo apt-get clean
          sudo curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o /usr/local/bin/repo
          sudo chmod 0755 /usr/local/bin/repo
          # repo init / git clone on a fresh runner need a committer identity;
          # without one, non-interactive git behavior is version-dependent.
          git config --global user.name  "CI Builder"
          git config --global user.email "ci@localhost"
          git config --global color.ui false

      - name: Check out device tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: src

      - name: Sync OrangeFox fox_14.1 base
        env:
          FOX_SYNC_COMMIT: 11e4406b2bd1de939a26b6bfbad7e371cc3b1fa7
        run: |
          FOX=/home/runner/fox
          mkdir -p "$FOX"
          git clone https://gitlab.com/OrangeFox/sync.git "$GITHUB_WORKSPACE/orangefox-sync"
          git -C "$GITHUB_WORKSPACE/orangefox-sync" checkout "$FOX_SYNC_COMMIT"
          # orangefox_sync.sh resolves its patches/ dir relative to CWD, so it
          # MUST be run from inside the sync checkout. It performs its own
          # `repo init` (OFox manifest -> twrp-14.1 minimal manifest) + sync.
          cd "$GITHUB_WORKSPACE/orangefox-sync"
          ./orangefox_sync.sh --branch 14.1 --path "$FOX"
          du -sh "$FOX" || true
          df -h

      - name: Add pinned kernel source and sync
        run: |
          FOX=/home/runner/fox
          mkdir -p "$FOX/.repo/local_manifests"
          cp "$GITHUB_WORKSPACE/src/.github/manifests/caymanslm.xml" \
            "$FOX/.repo/local_manifests/caymanslm.xml"
          cd "$FOX"
          repo sync -c -j"$(nproc)" --force-sync --no-clone-bundle --no-tags \
            kernel/lge/sdm845
          df -h

      - name: Install caymanslm device tree
        run: |
          FOX=/home/runner/fox
          mkdir -p "$FOX/device/lge"
          rm -rf "$FOX/device/lge/caymanslm"
          cp -a "$GITHUB_WORKSPACE/src/device/lge/caymanslm" "$FOX/device/lge/caymanslm"

      - name: Patch OrangeFox source (fox_14.1 bugs)
        run: |
          FOX=/home/runner/fox
          # fox_14.1: partitionmanager.cpp uses AID_MEDIA_RW but (unlike its
          # sibling files) never includes the header that defines it. On the
          # Android-14 (ap2a) base the constant no longer leaks in transitively,
          # so the compile fails with "use of undeclared identifier
          # 'AID_MEDIA_RW'". Add the include its siblings already use. Idempotent.
          pm="$FOX/bootable/recovery/partitionmanager.cpp"
          if ! grep -q 'private/android_filesystem_config.h' "$pm"; then
            sed -i '/#include <pwd.h>/a #include <private/android_filesystem_config.h>' "$pm"
            echo "Patched AID_MEDIA_RW include into partitionmanager.cpp"
          else
            echo "partitionmanager.cpp already includes android_filesystem_config.h — skipping"
          fi
          # fox_14.1: the recovery init.recovery.logd.rc declares only the
          # logdr/logdw sockets. Stock logd.rc also declares the "logd" control
          # socket; logd binds all three at startup and dies without it, so the
          # service crash-loops every 5s and logd.ready is never set (logcat
          # unusable). Add the missing control socket. Idempotent.
          lrc=$(grep -rl 'socket logdw dgram' "$FOX/bootable/recovery" 2>/dev/null | head -1)
          if [ -n "$lrc" ] && ! grep -q 'socket logd stream' "$lrc"; then
            sed -i '/socket logdr seqpacket/i\    socket logd stream 0666 root root' "$lrc"
            echo "Patched logd control socket into $lrc"
          else
            echo "logd rc already has control socket (or rc not found: '$lrc') — skipping"
          fi
          # strace is not recovery_available upstream, so soong silently skips
          # it when TARGET_RECOVERY_DEVICE_MODULES asks for it in the ramdisk.
          # Mark it recovery_available so the debug kit (logd/logcat/strace)
          # is complete in the image. Idempotent.
          bp="$FOX/external/strace/Android.bp"
          if [ -f "$bp" ] && ! grep -q 'recovery_available' "$bp"; then
            sed -i '/name: "strace",/a\    recovery_available: true,' "$bp"
            echo "Patched recovery_available into external/strace"
          else
            echo "strace already recovery_available (or Android.bp missing) — skipping"
          fi
          # crash_dump + tombstoned are likewise not recovery_available upstream;
          # mark them so the crash-capture layer lands in the ramdisk (requested
          # as crash_dump.recovery / tombstoned.recovery in BoardConfig.mk). Idempotent.
          dbp="$FOX/system/core/debuggerd/Android.bp"
          if [ -f "$dbp" ]; then
            grep -A3 'name: "crash_dump",' "$dbp" | grep -q recovery_available || \
              sed -i '/name: "crash_dump",/a\    recovery_available: true,' "$dbp"
            grep -A3 'name: "tombstoned",' "$dbp" | grep -q recovery_available || \
              sed -i '/name: "tombstoned",/a\    recovery_available: true,' "$dbp"
            echo "Ensured recovery_available on crash_dump + tombstoned"
          else
            echo "debuggerd Android.bp not found at $dbp — skipping"
          fi
          # logd's DropPrivs() calls set_sched_policy(0, SP_BACKGROUND) and treats
          # failure as FATAL. In recovery there is no /etc/task_profiles.json and
          # cgroups aren't mounted, so it ALWAYS fails -> logd aborts at startup in
          # a 5s crash loop and logcat never becomes usable. logd doesn't need
          # background scheduling in recovery; make that one failure non-fatal.
          # (Confirmed via symbolized tombstone: system/logging/logd/main.cpp:78.)
          # Idempotent.
          lmain="$FOX/system/logging/logd/main.cpp"
          if [ -f "$lmain" ] && grep -q 'PLOG(FATAL) << "failed to set background scheduling policy"' "$lmain"; then
            sed -i 's/PLOG(FATAL) << "failed to set background scheduling policy"/PLOG(ERROR) << "failed to set background scheduling policy (non-fatal in recovery)"/' "$lmain"
            echo "Patched logd set_sched_policy FATAL -> ERROR"
          else
            echo "logd main.cpp already patched (or not found) — skipping"
          fi
          # keystore2's IKeystoreService is @VintfStability. servicemanager's
          # meetsDeclarationRequirements() requires such services to be declared
          # in a framework VINTF manifest, which recovery has none of (logs
          # "NULL VINTF MANIFEST!: framework"). So keystore2's add_service returns
          # UNKNOWN_ERROR -> it panics at keystore2_main.rs:106 -> crash-loops ->
          # FBE decrypt never happens. VINTF-stability enforcement is meaningless
          # in recovery; make the add-gate declaration check pass (only the :298
          # occurrence inside meetsDeclarationRequirements; the client-query path
          # that uses '*outReturn = isVintfDeclared(name);' is untouched). Idempotent.
          sm="$FOX/frameworks/native/cmds/servicemanager/ServiceManager.cpp"
          if [ -f "$sm" ] && grep -q 'return isVintfDeclared(name);' "$sm"; then
            # (void)name keeps the now-unused param from tripping -Werror=unused-parameter.
            sed -i 's|return isVintfDeclared(name);|(void)name; return true; // recovery: skip VINTF-stability declaration (no framework manifest)|' "$sm"
            echo "Patched servicemanager meetsDeclarationRequirements -> true"
          else
            echo "servicemanager already patched (or not found) — skipping"
          fi
          # TWRP's Decrypt_DE() retry loop (partition.cpp) retries only 3 times
          # with a 2ms sleep -- it gives up in ~5ms. But keystore2 (needed for the
          # fscrypt DE-key install) doesn't finish registering until ~5s into boot
          # on this device (it crash-loops until keymaster+servicemanager are up),
          # so the no-PIN auto-decrypt always misses it and /data stays encrypted.
          # Widen the retry window to ~30s so decrypt waits for keystore2. Idempotent.
          pc="$FOX/bootable/recovery/partition.cpp"
          if [ -f "$pc" ] && grep -q 'int retry_count = 3;' "$pc"; then
            sed -i 's/int retry_count = 3;/int retry_count = 30;/' "$pc"
            sed -i '/Decrypt_DE() && --retry_count/{n;s/usleep(2000);/usleep(1000000);/}' "$pc"
            echo "Widened Decrypt_DE retry window for keystore2 startup"
          else
            echo "partition.cpp Decrypt_DE retry already patched (or not found) — skipping"
          fi

      - name: Disk capacity gate (require >= 25 GiB free before build)
        run: |
          avail_kb=$(df --output=avail -k /home/runner | tail -1 | tr -d ' ')
          avail_gib=$(( avail_kb / 1024 / 1024 ))
          echo "Free after sync: ${avail_gib} GiB"
          if [ "$avail_gib" -lt 25 ]; then
            echo "::error::Insufficient free space (${avail_gib} GiB < 25 GiB). Aborting before build to avoid a false failure."
            exit 1
          fi

      - name: Build recovery
        shell: bash
        run: |
          FOX=/home/runner/fox
          exec > >(tee "$GITHUB_WORKSPACE/build.log") 2>&1
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=caymanslm
          export FOX_BUILD_TYPE="${{ github.event.inputs.build_type }}"
          export FOX_DISABLE_UPDATEZIP=1
          export LC_ALL=C
          cd "$FOX"
          # envsetup.sh can return nonzero for benign reasons, so don't let its
          # exit status abort the step — but immediately assert the environment
          # it was supposed to establish, so a genuinely broken setup fails loudly
          # instead of silently proceeding to lunch (which hid the real error).
          set +e
          source build/envsetup.sh
          set -e
          declare -F lunch >/dev/null || { echo "::error::envsetup.sh did not define 'lunch'"; exit 1; }
          declare -F mka   >/dev/null || { echo "::error::envsetup.sh did not define 'mka'"; exit 1; }
          test -n "${ANDROID_BUILD_TOP:-}" || { echo "::error::ANDROID_BUILD_TOP is unset after envsetup"; exit 1; }
          test -f bootable/recovery/orangefox.mk || { echo "::error::OrangeFox recovery (bootable/recovery/orangefox.mk) not synced"; exit 1; }
          # Release-config build system (Android-14+): the lunch combo is
          # <product>-<release>-<variant>, not <product>-<variant>. The base
          # OrangeFox/twrp-14 manifest provides the "ap2a" release.
          lunch twrp_caymanslm-ap2a-eng
          mka adbd recoveryimage

      - name: Validate recovery image
        shell: bash
        run: |
          set -euo pipefail
          FOX=/home/runner/fox
          image="$FOX/out/target/product/caymanslm/recovery.img"
          test -f "$image"
          size=$(stat -c %s "$image")
          echo "recovery.img size: $size"
          test "$size" -le 104857600
          mkdir -p "$GITHUB_WORKSPACE/artifacts/unpacked"
          cp "$image" "$GITHUB_WORKSPACE/artifacts/recovery-caymanslm.img"
          python3 "$FOX/system/tools/mkbootimg/unpack_bootimg.py" \
            --boot_img "$image" \
            --out "$GITHUB_WORKSPACE/artifacts/unpacked" \
            --format mkbootimg | tee "$GITHUB_WORKSPACE/artifacts/boot-header.txt"
          grep -Fq -- "--header_version 1" "$GITHUB_WORKSPACE/artifacts/boot-header.txt"
          # Confirm the FBE decrypt chain actually made it into the ramdisk.
          rr="$FOX/out/target/product/caymanslm/recovery/root"
          # (1) Hard gate: the twrp-common orchestration rc files. These are
          # installed ONLY when BOARD_USES_QCOM_FBE_DECRYPTION is set, and
          # twrp-common guarantees init.recovery.*.rc files are copied into the
          # recovery ramdisk. Their absence means the E1-class regression
          # (decrypt module compiled to nothing) has returned — a real failure.
          fail=0
          for f in \
            "$rr/init.recovery.qcom_decrypt.rc" \
            "$rr/init.recovery.qcom_decrypt.fbe.rc"; do
            if [ -e "$f" ]; then
              echo "OK: present $f"
            else
              echo "::error::Decrypt orchestration missing: $f (check BOARD_USES_QCOM_FBE_DECRYPTION and the device/qcom/twrp-common sync)"
              fail=1
            fi
          done
          # (2) Hard gate: the bundled service binaries at their /system/bin
          # runtime location (placed by our own PRODUCT_COPY_FILES).
          for f in \
            "$rr/system/bin/qseecomd" \
            "$rr/system/bin/android.hardware.keymaster@4.0-service-qti" \
            "$rr/system/bin/android.hardware.gatekeeper@1.0-service-qti"; do
            if [ -e "$f" ]; then
              echo "OK: present $f"
            else
              echo "::error::Bundled crypto binary missing: $f"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          # (3) Soft check: prepdecrypt.sh — its exact final ramdisk path
          # depends on TWRP ramdisk assembly, so warn rather than fail.
          if [ -e "$rr/system/bin/prepdecrypt.sh" ]; then
            echo "prepdecrypt.sh present in ramdisk"
          else
            echo "::warning::prepdecrypt.sh not found under $rr/system/bin — verify its final path on-device"
          fi
          # Also copy any OrangeFox-named artifact if produced
          cp "$FOX"/out/target/product/caymanslm/OrangeFox*.img \
            "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || true
          (cd "$GITHUB_WORKSPACE/artifacts" && sha256sum recovery-caymanslm.img > SHA256SUMS)

      - name: Upload recovery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orangefox-caymanslm-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Collect diagnostics
        if: always()
        run: |
          FOX=/home/runner/fox
          mkdir -p /tmp/diagnostics
          cp "$GITHUB_WORKSPACE/build.log" /tmp/diagnostics/ 2>/dev/null || true
          df -h > /tmp/diagnostics/disk-usage.txt
          if [ -d "$FOX" ]; then
            (cd "$FOX" && repo manifest -r) > /tmp/diagnostics/pinned-manifest.xml 2>/dev/null || true
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orangefox-caymanslm-diagnostics-${{ github.run_number }}
          path: /tmp/diagnostics/
          if-no-files-found: warn
          retention-days: 14
